version: '3.8'

services:
  # Serviço do Banco de Dados MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 466238
      MYSQL_DATABASE: course
      MYSQL_USER: course
      MYSQL_PASSWORD: 466238
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: